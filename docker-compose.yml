services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      # Configuración servicio OCR de Reigreengroup (requerido para import por OCR y lecciones)
      - OCR_BASE_URL=${OCR_BASE_URL:-https://ocr.reigreengroup.com}
      - OCR_API_KEY=${OCR_API_KEY:-}
      # Configuración zAI (opcional)
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_MODEL=${ZAI_MODEL:-}
    volumes:
      - jp-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy

volumes:
  jp-data:
