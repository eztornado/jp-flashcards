version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jp-flashcards-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Configuración Ollama (opcional)
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      # Configuración zAI (opcional)
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_MODEL=${ZAI_MODEL:-}
    # Temporarily disable volume to test
    # volumes:
    #   # Persistencia de la base de datos SQLite
    #   - jp-data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=new net.Socket();const t=setTimeout(()=>s.destroy(),8000);s.connect(3000,'localhost',()=>{clearTimeout(t);s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jp-flashcards-frontend
    restart: unless-stopped
    # No depends_on - let both start independently
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - jp-network

volumes:
  # Volumen persistente para la base de datos
  jp-data:
    driver: local
    # Opcional: especificar ruta en el host
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/on/host/data

networks:
  jp-network:
    driver: bridge
