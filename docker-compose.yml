version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jp-flashcards-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Configuración Ollama (opcional)
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      # Configuración zAI (opcional)
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_MODEL=${ZAI_MODEL:-}
    volumes:
      # Persistencia de la base de datos SQLite
      - jp-data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/random', (r) => process.exit((r.statusCode === 200 || r.statusCode === 404) ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jp-flashcards-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - jp-network

volumes:
  # Volumen persistente para la base de datos
  jp-data:
    driver: local
    # Opcional: especificar ruta en el host
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/on/host/data

networks:
  jp-network:
    driver: bridge
