version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jp-flashcards-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Configuración Ollama (opcional)
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      # Configuración servicio OCR de Reigreengroup (requerido para import por OCR y lecciones)
      - OCR_BASE_URL=${OCR_BASE_URL:-https://ocr.reigreengroup.com}
      - OCR_API_KEY=${OCR_API_KEY:-}
      # Configuración zAI (opcional)
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_MODEL=${ZAI_MODEL:-}
    volumes:
      # Persistencia de la base de datos SQLite
      - jp-data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/random || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 90s
    networks:
      - jp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jp-flashcards-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - jp-network

volumes:
  # Volumen persistente para la base de datos
  jp-data:
    driver: local
    # Opcional: especificar ruta en el host
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/on/host/data

networks:
  jp-network:
    driver: bridge
