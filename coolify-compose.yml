# Configuración optimizada para Coolify
# Este archivo es específico para despliegues en Coolify

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # IA Configuration (Optional)
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_MODEL=${ZAI_MODEL:-}
    volumes:
      # Coolify maneja los volúmenes automáticamente
      - jp-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/random', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 90s
    labels:
      # Coolify labels
      - coolify.enable=true
      - coolify.name=JP Flashcards Backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      # Coolify labels
      - coolify.enable=true
      - coolify.name=JP Flashcards Frontend

volumes:
  jp-data:
    # Coolify configurará el volumen persistente automáticamente

networks:
  default:
    name: jp-flashcards-network
